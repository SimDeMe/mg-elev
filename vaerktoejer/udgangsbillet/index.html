  Udgangsbilletter: skriv et spørgsmål, og print et A4-ark med ens billetter og klippelinjer.
  Adressen kan fylde felterne ud, og når felterne ændres, skrives de ind i adressen igen.
    q       spørgsmålet (linjeskift som %0A, plus som %2B)
    titel   overskriften (forvalgt "Udgangsbillet")
    linje   den lille linje ved overskriften, fx "Kemi C · kapitel 2 · modul 4"
    n       billetter pr. ark: 4, 6, 8 eller 10 (forvalgt 6), altid i to kolonner
    svar    linjer, felt (tomt felt) eller pil (boks med en reaktionspil, lidt til højre for midten) (forvalgt linjer)
    navn    1 = med navnefelt, 0 = uden (forvalgt 1)
    skrift  kemibogen, segoe, calibri, arial, verdana, georgia eller times (forvalgt kemibogen)
    str     spørgsmålets størrelse: lille (12 pt), mellem (14 pt) eller stor (16 pt) (forvalgt mellem);
            for lang tekst gøres mindre af sig selv
    formel  0 = formler skrives, som de står (forvalgt 1)
  Eksempel: udgangsbillet.html?q=Skriv+formlen+for+magnesiumchlorid.&linje=Kemi+C&n=8&svar=linjer&navn=1&skrift=calibri&str=lille
  Formler (når formel=1): tal lige efter et grundstof eller ")" sænkes (MgCl2 → MgCl₂), og ladninger hæves:
  Mg^2+, Mg2+, OH-, OH^-, CO3^2- (et ^ er altid entydigt). Tal efter et mellemrum røres ikke ("2 dråber").
-->

/* Kemibogen I slut */
:root {
  --bord: #e6ecea;
  --ark: #ffffff;
  --blæk: #14201f;
  --dæmpet: #55635f;
  --streg: #d3dcd9;
  --accent: #0f766e;
  --accent-svag: #e3f1ef;
  --advarsel: #9a3412;
  --advarsel-bg: #fbefe6;
  --skrift: "Kemibogen I", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bord); }
body {
  margin: 0; background: var(--bord); color: var(--blæk);
  font: 15px/1.5 var(--skrift);
  padding: 24px 16px 48px;
}
.side {
  max-width: 1240px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 32px; align-items: start;
}

/* Formularen */
.formular { display: grid; gap: 16px; min-width: 0; }
.række { display: grid; grid-template-columns: 2fr 3fr; gap: 12px; }
.formular h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; }
.indledning { margin: 6px 0 0; color: var(--dæmpet); }
.felt { display: grid; gap: 6px; min-width: 0; }
.felt > label, .felt-hoved > label:first-child, .gruppe-navn { font-weight: 600; font-size: .9rem; }
.felt-hoved { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.felt-hoved .afkryds { font-size: .88rem; }
textarea, input[type="text"] {
  font: inherit; color: inherit; background: var(--ark);
  border: 1px solid var(--streg); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 6.2em; line-height: 1.4; }
textarea:focus, input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
::placeholder { color: #8a9693; }
.regel { margin: 0; font-size: .82rem; color: var(--dæmpet); }
.regel sub, .regel sup { font-size: 70%; line-height: 0; position: relative; vertical-align: baseline; }
.regel sup { top: -.5em; }
.regel sub { bottom: -.25em; }
.afkryds { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.skifter {
  display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; justify-self: start;
  background: var(--ark); border: 1px solid var(--streg); border-radius: 10px;
}
.skifter label { position: relative; }
.skifter input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.skifter span { display: block; min-width: 44px; text-align: center; padding: 6px 14px; border-radius: 7px; cursor: pointer; }
.skifter.skrifter span { padding-inline: 11px; }
.skifter input:checked + span { background: var(--accent); color: #fff; }
.skifter input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.knapper { display: grid; gap: 8px; }
.knaprække { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 18px; border: 1px solid var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lav { background: var(--accent); color: #fff; font-weight: 600; }
.kopier { background: var(--ark); color: var(--accent); }
.note { margin: 0; font-size: .85rem; color: var(--dæmpet); }

/* Forhåndsvisningen */
.vis { position: sticky; top: 16px; display: grid; justify-items: center; gap: 10px; min-width: 0; }
.besked {
  margin: 0; justify-self: stretch; font-size: .88rem; padding: 8px 12px; border-radius: 0 6px 6px 0;
  background: var(--advarsel-bg); color: var(--advarsel); border-left: 3px solid var(--advarsel);
}
.besked.mild { background: var(--accent-svag); color: var(--blæk); border-left-color: var(--accent); }
.ramme { background: #fff; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 32, 31, .14), 0 8px 24px rgba(20, 32, 31, .10); }
@media (max-width: 820px) {
  .side { grid-template-columns: minmax(0, 1fr); }
  .vis { position: static; }
}

/* Arket: 210 × 297 mm, billetterne i to kolonner, klippelinjerne som SVG ovenpå */
.ark {
  --kol: 2; --rk: 3; --pad-y: 9mm; --pad-x: 7.5mm; --spm: 14pt;
  width: 210mm; height: 297mm; position: relative; overflow: hidden;
  background: #fff; color: #14201f; font-family: var(--skrift); /* skriftvalget sættes af scriptet */
  display: grid; grid-template-columns: repeat(var(--kol), 1fr); grid-template-rows: repeat(var(--rk), 1fr);
  transform-origin: 0 0;
}
.billet { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; padding: var(--pad-y) var(--pad-x); }
.b-hoved { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 1mm 4mm; line-height: 1.25; }
.b-titel { font-size: 9.5pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0f766e; }
.b-linje { font-size: 9pt; color: #55635f; }
.b-navn { display: flex; align-items: flex-end; gap: 2mm; font-size: 10.5pt; line-height: 1.25; }
.b-navn span { flex: 0 1 60mm; height: 5mm; border-bottom: .3mm solid #7d8986; }
.b-hoved + .b-navn { margin-top: 2.5mm; }
.b-spm { font-size: var(--spm); line-height: 1.3; overflow-wrap: break-word; }
.b-spm:not(:first-child) { margin-top: 3mm; }
.b-spm sub, .b-spm sup { font-size: 70%; line-height: 0; position: relative; vertical-align: baseline; }
.b-spm sup { top: -.5em; }
.b-spm sub { bottom: -.25em; }
.b-spm.tom { color: #9aa5a2; font-style: italic; }
.b-spm .nb { white-space: nowrap; }
.b-svar { flex: 1 1 auto; min-height: 0; margin-top: 1mm; }
.b-svar.linjer i { display: block; height: 8mm; border-bottom: .25mm solid #bcc6c3; }
.b-svar.felt, .b-svar.pil { margin-top: 3mm; border: .3mm solid #bcc6c3; border-radius: 2mm; }
/* Pilen står lodret i midten og lidt til højre for midten (dens midte ved 61 %), for venstre side af et
   ionskema er den længste: "Mg²⁺(aq) + CO₃²⁻(aq)" i håndskrift er ca. 47 mm, "MgCO₃(s)" ca. 20 mm.
   Helt i midten: margin-left: calc(50% - 5.5mm). */
.b-svar.pil { display: flex; align-items: center; }
.b-svar.pil svg { width: 11mm; height: 4mm; flex: none; margin-left: calc(61% - 5.5mm); }
.klip { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Udskrift: kun arket, i fuld størrelse */
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff; margin: 0; padding: 0; }
  .formular, .besked { display: none !important; }
  .side { display: block; max-width: none; margin: 0; }
  .vis { position: static; display: block; }
  .ramme { width: auto !important; height: auto !important; box-shadow: none; overflow: visible; }
  .ark { transform: none !important; height: 296.9mm; }
  .b-spm.tom { visibility: hidden; }
}
</style>
</head>
<body>
<main class="side">
  <section class="formular" aria-label="Billetten">
    <div>
      <h1>Udgangsbilletter</h1>
      <p class="indledning">Skriv spørgsmålet, og print arket. Klip langs de stiplede linjer.</p>
    </div>

    <div class="felt">
      <div class="felt-hoved">
        <label for="spm">Spørgsmål</label>
        <label class="afkryds"><input type="checkbox" id="formel" checked> Formler</label>
      </div>
      <textarea id="spm" rows="4" placeholder="Fx: Hvorfor lyser pæren i saltvand, men ikke i sukkervand?"></textarea>
      <p class="regel">MgCl2 → MgCl<sub>2</sub>, CO3^2- → CO<sub>3</sub><sup>2−</sup>. Tal efter mellemrum røres ikke.</p>
    </div>

    <div class="række">
      <div class="felt">
        <label for="titel">Overskrift</label>
        <input type="text" id="titel" value="Udgangsbillet">
      </div>
      <div class="felt">
        <label for="linje">Lille linje <span class="note">(valgfri)</span></label>
        <input type="text" id="linje" placeholder="Fx Kemi C · kapitel 2">
      </div>
    </div>

    <div class="felt">
      <span class="gruppe-navn" id="n-navn">Billetter pr. ark</span>
      <div class="skifter" role="radiogroup" aria-labelledby="n-navn">
        <label><input type="radio" name="n" value="4"><span>4</span></label>
        <label><input type="radio" name="n" value="6" checked><span>6</span></label>
        <label><input type="radio" name="n" value="8"><span>8</span></label>
        <label><input type="radio" name="n" value="10"><span>10</span></label>
      </div>
    </div>

    <div class="felt">
      <span class="gruppe-navn" id="svar-navn">Plads til svar</span>
      <div class="skifter" role="radiogroup" aria-labelledby="svar-navn">
        <label><input type="radio" name="svar" value="linjer" checked><span>Linjer</span></label>
        <label><input type="radio" name="svar" value="felt"><span>Tomt felt</span></label>
        <label><input type="radio" name="svar" value="pil"><span>Boks med reaktionspil</span></label>
      </div>
    </div>

    <div class="felt">
      <span class="gruppe-navn" id="skrift-navn">Skrifttype</span>
      <div class="skifter skrifter" role="radiogroup" aria-labelledby="skrift-navn">
        <label><input type="radio" name="skrift" value="kemibogen" checked><span style="font-family: var(--skrift)">Kemibogen</span></label>
        <label><input type="radio" name="skrift" value="segoe"><span style="font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif">Segoe UI</span></label>
        <label><input type="radio" name="skrift" value="calibri"><span style="font-family: Calibri, Carlito, 'Segoe UI', Arial, sans-serif">Calibri</span></label>
        <label><input type="radio" name="skrift" value="arial"><span style="font-family: Arial, 'Liberation Sans', Helvetica, sans-serif">Arial</span></label>
        <label><input type="radio" name="skrift" value="verdana"><span style="font-family: Verdana, 'DejaVu Sans', sans-serif">Verdana</span></label>
        <label><input type="radio" name="skrift" value="georgia"><span style="font-family: Georgia, 'DejaVu Serif', serif">Georgia</span></label>
        <label><input type="radio" name="skrift" value="times"><span style="font-family: 'Times New Roman', Times, 'Liberation Serif', serif">Times New Roman</span></label>
      </div>
    </div>

    <div class="felt">
      <span class="gruppe-navn" id="str-navn">Skriftstørrelse</span>
      <div class="skifter" role="radiogroup" aria-labelledby="str-navn">
        <label><input type="radio" name="str" value="lille"><span>Lille</span></label>
        <label><input type="radio" name="str" value="mellem" checked><span>Mellem</span></label>
        <label><input type="radio" name="str" value="stor"><span>Stor</span></label>
      </div>
    </div>

    <label class="afkryds"><input type="checkbox" id="navn" checked> Navnefelt</label>

    <div class="knapper">
      <div class="knaprække">
        <button type="button" class="lav" id="lav">Lav PDF</button>
        <p class="note">Vælg <b>Gem som PDF</b> i printvinduet.</p>
      </div>
      <div class="knaprække">
        <button type="button" class="kopier" id="kopier">Kopiér link</button>
        <p class="note" id="kopieret" role="status" hidden></p>
      </div>
    </div>
  </section>

  <section class="vis" id="vis" aria-label="Arket">
    <p class="besked" id="besked" role="status" hidden></p>
    <div class="ramme" id="ramme"><div class="ark" id="ark"></div></div>
  </section>
</main>

<script>
(() => {
  const STØRRELSER = [4, 6, 8, 10];
  const SPM_PT = { lille: 12, mellem: 14, stor: 16 }; // spørgsmålets skrift på papir
  const MIN_PT = 11;                                // mindre end det bliver den ikke
  const SKRIFTER = ["kemibogen", "segoe", "calibri", "arial", "verdana", "georgia", "times"];
  // Reaktionspilen i boksen, i samme grå som navnelinjen
  const PIL = `<svg viewBox="0 0 11 4" aria-hidden="true"><path d="M0 2H9.4" stroke="#869290" stroke-width=".45"/>` +
    `<path d="M11 2 8.4.85v2.3z" fill="#869290"/></svg>`;
  const LINJE_MM = 8, MIN_LINJE_MM = 7;             // afstand mellem svarlinjerne
  const MM = 96 / 25.4;                             // px pr. mm
  const FORVALG_TITEL = "Udgangsbillet";

  const $ = id => document.getElementById(id);
  const ark = $("ark"), ramme = $("ramme"), vis = $("vis"), besked = $("besked");
  const spmFelt = $("spm"), titelFelt = $("titel"), linjeFelt = $("linje"), formelFelt = $("formel"), navnFelt = $("navn");

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* Formler start */
  const GRUNDSTOFFER = new Set(("H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn " +
    "Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy " +
    "Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr").split(" "));
  // En formel består kun af grundstofsymboler, tal og parenteser og begynder med et stort bogstav eller "(".
  function erFormel(s) {
    if (!/^[A-Z(]/.test(s)) return false;
    const dele = s.match(/[A-Z][a-z]?|\d+|[()]/g);
    return !!dele && dele.join("") === s && dele.some(d => GRUNDSTOFFER.has(d)) &&
      dele.every(d => /^(\d+|[()])$/.test(d) || GRUNDSTOFFER.has(d));
  }
  const antal = (s, c) => s.split(c).length - 1;
  // Teksten er allerede escapet. Tre trin: ^ hæver, ladninger uden ^ hæves, tal i formler sænkes.
  function formler(t) {
    t = t.replace(/\^([+\-−]?\d*[+\-−]?)/g, (m, x) => x ? "<sup>" + x.replace(/-/g, "−") + "</sup>" : m);
    t = t.replace(/(^|[^\p{L}\p{N}()])([\p{L}\p{N}()]+)([+\-−])(?=$|[\s.,;:!?)\]\/\-−–—(<&"'»”])/gu,
      (m, før, tok, tegn, pos, hel) => {
        while (tok[0] === "(" && antal(tok, "(") > antal(tok, ")")) { før += "("; tok = tok.slice(1); }
        const [, koef, krop, tal] = tok.match(/^(\d*)(.*?)(\d*)$/);
        if (!erFormel(krop)) return m;
        // "C- og H-atomer": bindestregen hører til ordet, ikke en ladning
        if (tegn !== "+" && /^\s+(og|eller|samt|til)\s+\S*?[-−]\p{L}/u.test(hel.slice(pos + m.length))) return m;
        const enkelt = /^[A-Z][a-z]?$/.test(krop);
        let sænk = "", ladning = "";
        if (tal.length >= 2) { sænk = tal.slice(0, -1); ladning = tal.slice(-1); } // CO32- → CO₃²⁻
        else if (tal && enkelt) ladning = tal;                                       // Cu2+ → Cu²⁺
        else sænk = tal;                                                              // NH4+ → NH₄⁺
        return før + koef + krop + sænk + "<sup>" + ladning + (tegn === "+" ? "+" : "−") + "</sup>";
      });
    t = t.replace(/[\p{L}\p{N}()]+/gu, tok => {
      const [, koef, kerne, tilstand] = tok.match(/^(\d*)(.*?)((?:\((?:s|l|g|aq)\))?)$/);
      if (!erFormel(kerne)) return tok;
      return koef + kerne.replace(/([A-Za-z)])(\d+)/g, "$1<sub>$2</sub>") + tilstand;
    });
    return t;
  }
  /* Formler slut */

  function værdier() {
    return {
      q: spmFelt.value.replace(/^\s+|\s+$/g, ""),
      titel: titelFelt.value.trim(),
      linje: linjeFelt.value.trim(),
      n: +document.querySelector('input[name="n"]:checked').value,
      svar: document.querySelector('input[name="svar"]:checked').value,
      skrift: document.querySelector('input[name="skrift"]:checked').value,
      str: document.querySelector('input[name="str"]:checked').value,
      navn: navnFelt.checked,
      formel: formelFelt.checked,
    };
  }

  function læsAdresse() {
    const p = new URLSearchParams(location.search);
    if (p.has("q")) spmFelt.value = p.get("q");
    if (p.has("titel")) titelFelt.value = p.get("titel");
    if (p.has("linje")) linjeFelt.value = p.get("linje");
    let n = parseInt(p.get("n"), 10);
    if (!isNaN(n)) {
      n = STØRRELSER.reduce((a, b) => Math.abs(b - n) < Math.abs(a - n) ? b : a);
      document.querySelector(`input[name="n"][value="${n}"]`).checked = true;
    }
    const vælg = (navn, værdi) => { const r = document.querySelector(`input[name="${navn}"][value="${værdi}"]`); if (r) r.checked = true; };
    if (["felt", "pil"].includes(p.get("svar"))) vælg("svar", p.get("svar"));
    if (SKRIFTER.includes(p.get("skrift"))) vælg("skrift", p.get("skrift"));
    if (p.get("str") in SPM_PT) vælg("str", p.get("str"));
    if (p.get("navn") === "0") navnFelt.checked = false;
    if (p.get("formel") === "0") formelFelt.checked = false;
  }

  function forespørgsel() {
    const v = værdier(), p = new URLSearchParams();
    if (v.q) p.set("q", v.q);
    if (v.titel !== FORVALG_TITEL) p.set("titel", v.titel);
    if (v.linje) p.set("linje", v.linje);
    p.set("n", v.n);
    p.set("svar", v.svar);
    p.set("navn", v.navn ? "1" : "0");
    p.set("skrift", v.skrift);
    p.set("str", v.str);
    if (!v.formel) p.set("formel", "0");
    return "?" + p.toString();
  }
  let adresseTimer = 0;
  function skrivAdresse() {
    clearTimeout(adresseTimer);
    try { history.replaceState(null, "", forespørgsel() + location.hash); } catch (e) { /* fx file:// i nogle browsere */ }
  }

  function klippelinjer(rk) {
    const h = 297 / rk;
    const saks = (x, y, drej) =>
      `<g transform="translate(${x} ${y}) rotate(${drej}) translate(-3.1 -3.1) scale(${6.2 / 24})">` +
      `<rect x="-1" y="1" width="26" height="22" fill="#fff"/>` +
      `<g fill="none" stroke="#7d8986" stroke-width="1.7" stroke-linecap="round">` +
      `<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>` +
      `<path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></g></g>`;
    let s = `<svg class="klip" viewBox="0 0 210 297" aria-hidden="true">` +
      `<g stroke="#9aa5a2" stroke-width=".3" stroke-dasharray="2 1.6"><line x1="105" y1="0" x2="105" y2="297"/>`;
    for (let k = 1; k < rk; k++) s += `<line x1="0" y1="${k * h}" x2="210" y2="${k * h}"/>`;
    s += `</g>` + saks(105, 6.5, 90);
    for (let k = 1; k < rk; k++) s += saks(6.5, k * h, 0);
    return s + `</svg>`;
  }

  function tegn() {
    const v = værdier();
    const rk = v.n / 2, højde = 297 / rk;
    ark.style.setProperty("--rk", rk);
    ark.style.setProperty("--pad-y", Math.min(10, Math.max(6, højde * 0.1)).toFixed(2) + "mm");
    // Billetternes skrift er den, knappen selv er skrevet med.
    ark.style.fontFamily = document.querySelector('input[name="skrift"]:checked + span').style.fontFamily;

    const tom = !v.q;
    let spm = tom ? "Spørgsmålet kommer her." : esc(v.q);
    if (!tom && v.formel) spm = formler(spm);
    // Navne som 2-methylpentan og pentan-2-ol brydes ikke ved bindestregen.
    spm = spm.replace(/[\p{L}\p{N},]+(?:-[\p{L}\p{N},]+)+/gu, ord => /\d-|-\d/.test(ord) ? `<span class="nb">${ord}</span>` : ord);
    spm = spm.replace(/\r?\n/g, "<br>");

    const hoved = (v.titel || v.linje)
      ? `<div class="b-hoved">${v.titel ? `<span class="b-titel">${esc(v.titel)}</span>` : ""}` +
        `${v.linje ? `<span class="b-linje">${esc(v.linje)}</span>` : ""}</div>` : "";
    const billet = `<div class="billet">${hoved}${v.navn ? `<div class="b-navn">Navn:<span></span></div>` : ""}` +
      `<div class="b-spm${tom ? " tom" : ""}">${spm}</div><div class="b-svar ${v.svar}">${v.svar === "pil" ? PIL : ""}</div></div>`;
    ark.innerHTML = billet.repeat(v.n) + klippelinjer(rk);

    // Alle billetter er ens: mål den første, og gør spørgsmålet mindre, hvis svaret ikke får plads.
    const første = ark.querySelector(".billet"), svar = første.querySelector(".b-svar");
    const minPx = (v.svar === "linjer" ? 2 * MIN_LINJE_MM : 15) * MM;
    const passer = () => svar.offsetHeight >= minPx && første.scrollHeight <= første.clientHeight + 1;
    let pt = SPM_PT[v.str];
    ark.style.setProperty("--spm", pt + "pt");
    while (pt > MIN_PT && !passer()) { pt -= 0.5; ark.style.setProperty("--spm", pt + "pt"); }

    if (v.svar === "linjer") {
      // Linjerne fordeles jævnt over svarpladsen, med omkring 8 mm imellem og aldrig under 7 mm.
      const h = svar.offsetHeight / MM;
      let stk = Math.round(h / LINJE_MM);
      if (stk > 0 && h / stk < MIN_LINJE_MM) stk--;
      const linjer = stk > 0 ? `<i style="height:${(h / stk - 0.02).toFixed(3)}mm"></i>`.repeat(stk) : "";
      ark.querySelectorAll(".b-svar").forEach(b => { b.innerHTML = linjer; });
    }

    if (!passer()) {
      besked.textContent = "Spørgsmålet fylder for meget. Vælg færre billetter pr. ark, eller gør det kortere.";
      besked.className = "besked"; besked.hidden = false;
    } else if (pt < SPM_PT[v.str]) {
      besked.textContent = "Skriften er gjort lidt mindre, så der er plads til svaret.";
      besked.className = "besked mild"; besked.hidden = false;
    } else besked.hidden = true;

    document.title = (v.titel || FORVALG_TITEL) + (v.linje ? " – " + v.linje : "");
    skaler();
  }

  function skaler() {
    const bredde = 210 * MM, højde = 297 * MM;
    const smal = window.matchMedia("(max-width: 820px)").matches;
    const plads = window.innerHeight - 32 - (besked.hidden ? 0 : besked.offsetHeight + 10);
    let s = vis.clientWidth / bredde;
    if (!smal) s = Math.min(s, Math.max(320, plads) / højde);
    s = Math.min(s, 1);
    ark.style.transform = `scale(${s})`;
    ramme.style.width = bredde * s + "px";
    ramme.style.height = højde * s + "px";
  }

  function ændret() {
    tegn();
    clearTimeout(adresseTimer);
    adresseTimer = setTimeout(skrivAdresse, 400);
  }

  læsAdresse();
  document.querySelector(".formular").addEventListener("input", ændret);
  document.querySelector(".formular").addEventListener("change", ændret);
  window.addEventListener("resize", skaler);
  $("lav").addEventListener("click", () => { tegn(); skrivAdresse(); window.print(); });

  let kopiTimer = 0;
  $("kopier").addEventListener("click", async () => {
    skrivAdresse();
    const link = location.href.split(/[?#]/)[0] + forespørgsel();
    let ok = false;
    try { await navigator.clipboard.writeText(link); ok = true; } catch (e) {
      const f = document.createElement("textarea");
      f.value = link; document.body.append(f); f.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      f.remove();
    }
    const note = $("kopieret");
    note.textContent = ok ? "Linket er kopieret." : "Kopiér adressen fra adressefeltet.";
    note.hidden = false;
    clearTimeout(kopiTimer);
    kopiTimer = setTimeout(() => { note.hidden = true; }, 4000);
  });

  tegn();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tegn);
})();
</script>
</body>
</html>
